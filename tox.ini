[tox]
envlist = py311, lint, type
skipsdist = False

[testenv]
deps =
    pytest
    pytest-cov
    numpy
    scipy
    matplotlib
commands =
    pytest {posargs:tests/}

[testenv:lint]
deps =
    black
    isort
    flake8
commands =
    black --check persistent_distinctions/ tests/
    isort --check-only persistent_distinctions/ tests/
    flake8 persistent_distinctions/ tests/

[testenv:type]
deps =
    mypy
    types-all
commands =
    mypy persistent_distinctions/

[testenv:format]
deps =
    black
    isort
commands =
    black persistent_distinctions/ tests/
    isort persistent_distinctions/ tests/

[testenv:docs]
deps =
    sphinx
    sphinx-rtd-theme
    sphinx-autodoc-typehints
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees docs docs/_build/html

[testenv:coverage]
deps =
    pytest
    pytest-cov
    numpy
    scipy
    matplotlib
commands =
    pytest --cov=persistent_distinctions --cov-report=html --cov-report=term tests/

[gh-actions]
python =
    3.11: py311, lint, type, coverage